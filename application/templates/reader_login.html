<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ _("Reader Account") }} - KindleEar</title>
  <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-container {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }
    .auth-container:hover {
      box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.09), 0 10px 15px -5px rgba(15, 23, 42, 0.05);
    }
    .auth-header {
      padding: 34px 28px 22px 28px;
      text-align: center;
      background: #ffffff;
    }
    .brand-logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      color: #2563eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .brand-desc {
      font-size: 13.5px;
      color: #64748b;
      margin-top: 4px;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 13px 10px;
      font-size: 14.5px;
      font-weight: 600;
      color: #64748b;
      text-decoration: none;
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      color: #2563eb;
      background: #ffffff;
      border-bottom-color: #2563eb;
    }
    .auth-body {
      padding: 28px 28px 24px;
    }
    .tips-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      color: #b91c1c;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      margin-bottom: 20px;
      line-height: 1.45;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      pointer-events: none;
      transition: color 0.2s;
    }
    .form-input {
      width: 100%;
      padding: 11.5px 14px 11.5px 42px;
      font-size: 14.5px;
      color: #1e293b;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      background: #f8fafc;
    }
    .form-input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.12);
    }
    .input-wrapper:focus-within .input-icon {
      color: #2563eb;
    }
    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .toggle-pwd-btn:hover {
      color: #475569;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .submit-btn:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }
    .submit-btn:active {
      transform: translateY(0);
    }
    .submit-btn.btn-signup {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .submit-btn.btn-signup:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
    }
    .auth-footer {
      padding: 16px 28px 22px;
      text-align: center;
      font-size: 13.5px;
      color: #64748b;
      border-top: 1px solid #f1f5f9;
      background: #f8fafc;
    }
    .auth-link {
      color: #475569;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .auth-link:hover {
      color: #2563eb;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="brand-logo-badge">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
      </div>
      <div class="brand-title">KindleEar Reader</div>
      <div class="brand-desc">{{ _("Curated Media Reading Platform") }}</div>
    </div>

    <div class="auth-tabs">
      <a href="{{ url_for('bpReaderAuth.ReaderLogin', next=next) }}" class="auth-tab {% if mode == 'login' %}active{% endif %}">
        {{ _("Log In") }}
      </a>
      <a href="{{ url_for('bpReaderAuth.ReaderSignup', next=next) }}" class="auth-tab {% if mode == 'signup' %}active{% endif %}">
        {{ _("Sign Up") }}
      </a>
    </div>

    <div class="auth-body">
      {% if tips %}
      <div class="tips-box">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ tips }}</span>
      </div>
      {% endif %}

      {% if mode == 'login' %}
      <form action="{{ url_for('bpReaderAuth.ReaderLoginPost') }}" method="POST">
        <input type="hidden" name="next" value="{{ next }}" />
        <div class="form-group">
          <label class="form-label">{{ _("Username / Account") }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" name="username" class="form-input" placeholder="{{ _('Enter your username') }}" required autofocus />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">{{ _("Password") }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="reader-pwd" name="password" class="form-input" placeholder="{{ _('Enter your password') }}" required />
            <button type="button" class="toggle-pwd-btn" onclick="togglePwd('reader-pwd', this)">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="submit-btn">{{ _("Log In") }}</button>
      </form>
      {% else %}
      <form action="{{ url_for('bpReaderAuth.ReaderSignupPost') }}" method="POST">
        <input type="hidden" name="next" value="{{ next }}" />
        <div class="form-group">
          <label class="form-label">{{ _("Username") }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" name="username" class="form-input" placeholder="{{ _('Choose a username (3-30 chars)') }}" required autofocus />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">{{ _("Password") }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="signup-pwd1" name="password" class="form-input" placeholder="{{ _('Choose a password (min 4 chars)') }}" required />
            <button type="button" class="toggle-pwd-btn" onclick="togglePwd('signup-pwd1', this)">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">{{ _("Confirm Password") }}</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="signup-pwd2" name="confirm_password" class="form-input" placeholder="{{ _('Repeat your password') }}" required />
            <button type="button" class="toggle-pwd-btn" onclick="togglePwd('signup-pwd2', this)">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="submit-btn btn-signup">{{ _("Create Account") }}</button>
      </form>
      {% endif %}
    </div>

    <div class="auth-footer">
      <a href="{{ next or '/reader' }}" class="auth-link">← {{ _("Continue as Guest") }}</a>
    </div>
  </div>

  <script>
    function togglePwd(inputId, btn) {
      var input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    }
  </script>
</body>
</html>
